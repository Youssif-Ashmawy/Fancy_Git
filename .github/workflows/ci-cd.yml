name: CI/CD Pipeline

on:
  push:
    branches: [ developer, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  # Test job - runs first
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run unit tests
      run: |
        pytest -m "unit" -v --cov=src --cov-report=xml
        
    - name: Run integration tests
      run: |
        pytest -m "integration" -v
        
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Patch deployment - runs only if tests pass and pushed to main
  patch:
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer') && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install -r requirements-dev.txt
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Ensure VERSION file exists
      run: |
        if [ ! -f "VERSION" ]; then
          echo "1.0.0" > VERSION
        fi
    
    - name: Get current version
      id: version
      run: |
        if [ -f "VERSION" ]; then
          CURRENT_VERSION=$(cat VERSION)
        else
          CURRENT_VERSION="1.0.0"
        fi
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
    
    - name: Bump patch version
      run: |
        python -c "current='${{ steps.version.outputs.current_version }}'.split('.'); current[-1]=str(int(current[-1])+1); new_version='.'.join(current); open('VERSION','w').write(new_version)"
    
    - name: Get new version
      id: new_version
      run: |
        NEW_VERSION=$(cat VERSION)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
    
    - name: Build package
      run: |
        echo "Building package with version: $(cat VERSION)"
        echo "Current dist contents:"
        ls -la dist/ 2>/dev/null || echo "No dist directory"
        
        # More aggressive cleanup
        rm -rf dist/ build/ *.egg-info/
        find . -name "*.egg-info" -type d -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.egg" -delete 2>/dev/null || true
        
        echo "After cleanup:"
        ls -la dist/ 2>/dev/null || echo "No dist directory"
        
        # Force rebuild by touching setup.py
        touch setup.py
        
        # Verify VERSION file content right before build
        echo "=== VERSION FILE VERIFICATION ==="
        echo "VERSION file content:"
        cat VERSION
        echo "Expected version from workflow: ${{ steps.version.outputs.version }}"
        echo "=============================="
        
        # Build fresh packages
        python -m build --no-isolation
        
        echo "Built packages:"
        ls -la dist/
        
        # Debug: Show what setup.py actually read during build
        echo "=== BUILD DEBUG INFO ==="
        echo "Current directory: $(pwd)"
        echo "VERSION file exists: $([ -f VERSION ] && echo 'YES' || echo 'NO')"
        if [ -f VERSION ]; then
          echo "VERSION file content: '$(cat VERSION)'"
        else
          echo "VERSION file not found!"
        fi
        echo "===================="
    
    - name: Verify package versions
      run: |
        echo "Verifying package versions match VERSION file:"
        EXPECTED_VERSION=$(cat VERSION)
        echo "Expected version: $EXPECTED_VERSION"
        
        for file in dist/*; do
          if [[ "$file" == *.whl ]]; then
            echo "Checking wheel: $file"
            WHEEL_VERSION=$(python -c "import zipfile; z=zipfile.ZipFile('$file'); content=z.read([f for f in z.namelist() if 'METADATA' in f][0]).decode(); print([line.split(': ')[1] for line in content.split('\n') if line.startswith('Version: ')][0])")
            echo "Wheel version: $WHEEL_VERSION"
            if [[ "$WHEEL_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "ERROR: Version mismatch! Expected $EXPECTED_VERSION, got $WHEEL_VERSION"
              exit 1
            else
              echo "✓ Version matches"
            fi
          elif [[ "$file" == *.tar.gz ]]; then
            echo "Checking sdist: $file"
            tar -tzf "$file" | grep -E "^[^/]+-$EXPECTED_VERSION\.tar\.gz$" && echo "✓ Sdist version matches" || echo "ERROR: Sdist version mismatch"
          fi
        done
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ steps.new_version.outputs.new_version }}"
        name: "Release v${{ steps.new_version.outputs.new_version }}"
        body: |
          ## Release v${{ steps.new_version.outputs.new_version }}
          
          ### Changes
          - Automated patch release from main branch
          
          ### Installation
          ```bash
          pip install fancygit==${{ steps.new_version.outputs.new_version }}
          ```
          
          ### Quick Start
          ```bash
          python3 launcher.py
          ```
        files: |
          dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      run: |
        if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
          echo "Checking if version ${{ steps.new_version.outputs.new_version }} already exists on PyPI..."
          if python3 -c "import requests; r=requests.get(f'https://pypi.org/pypi/fancygit/${{ steps.new_version.outputs.new_version }}/json'); exit(0 if r.status_code==200 else 1)" 2>/dev/null; then
            echo "Version ${{ steps.new_version.outputs.new_version }} already exists on PyPI, skipping upload"
          else
            echo "Uploading new version ${{ steps.new_version.outputs.new_version }} to PyPI..."
            twine upload dist/* --verbose
          fi
        else
          echo "PYPI_API_TOKEN not configured, skipping PyPI publish"
        fi
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    
    - name: Create commit
      if: success()
      run: |
        git add VERSION
        git commit -m "chore: bump version to ${{ steps.new_version.outputs.new_version }} [skip ci]"
        git push origin $(basename ${{ github.ref }})

  # Release deployment - runs only if tests pass and tag pushed or manual
  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install -r requirements-dev.txt
    
    - name: Ensure VERSION file exists
      run: |
        if [ ! -f "VERSION" ]; then
          echo "1.0.0" > VERSION
        fi
    
    - name: Get version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Update VERSION file
      run: |
        echo "${{ steps.version.outputs.version }}" > VERSION
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add VERSION
        git diff --staged --quiet || git commit -m "chore: update VERSION to ${{ steps.version.outputs.version }} [skip ci]"
        git push || true
    
    - name: Build package
      run: |
        echo "Building package with version: $(cat VERSION)"
        echo "Current dist contents:"
        ls -la dist/ 2>/dev/null || echo "No dist directory"
        
        # More aggressive cleanup
        rm -rf dist/ build/ *.egg-info/
        find . -name "*.egg-info" -type d -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.egg" -delete 2>/dev/null || true
        
        echo "After cleanup:"
        ls -la dist/ 2>/dev/null || echo "No dist directory"
        
        # Force rebuild by touching setup.py
        touch setup.py
        
        # Verify VERSION file content right before build
        echo "=== VERSION FILE VERIFICATION ==="
        echo "VERSION file content:"
        cat VERSION
        echo "Expected version from workflow: ${{ steps.version.outputs.version }}"
        echo "=============================="
        
        # Build fresh packages
        python -m build --no-isolation
        
        echo "Built packages:"
        ls -la dist/
        
        # Debug: Show what setup.py actually read during build
        echo "=== BUILD DEBUG INFO ==="
        echo "Current directory: $(pwd)"
        echo "VERSION file exists: $([ -f VERSION ] && echo 'YES' || echo 'NO')"
        if [ -f VERSION ]; then
          echo "VERSION file content: '$(cat VERSION)'"
        else
          echo "VERSION file not found!"
        fi
        echo "===================="
    
    - name: Verify package versions
      run: |
        echo "Verifying package versions match VERSION file:"
        EXPECTED_VERSION=$(cat VERSION)
        echo "Expected version: $EXPECTED_VERSION"
        
        for file in dist/*; do
          if [[ "$file" == *.whl ]]; then
            echo "Checking wheel: $file"
            WHEEL_VERSION=$(python -c "import zipfile; z=zipfile.ZipFile('$file'); content=z.read([f for f in z.namelist() if 'METADATA' in f][0]).decode(); print([line.split(': ')[1] for line in content.split('\n') if line.startswith('Version: ')][0])")
            echo "Wheel version: $WHEEL_VERSION"
            if [[ "$WHEEL_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "ERROR: Version mismatch! Expected $EXPECTED_VERSION, got $WHEEL_VERSION"
              exit 1
            else
              echo "✓ Version matches"
            fi
          elif [[ "$file" == *.tar.gz ]]; then
            echo "Checking sdist: $file"
            tar -tzf "$file" | grep -E "^[^/]+-$EXPECTED_VERSION\.tar\.gz$" && echo "✓ Sdist version matches" || echo "ERROR: Sdist version mismatch"
          fi
        done
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ steps.version.outputs.version }}"
        name: "Release v${{ steps.version.outputs.version }}"
        body: |
          ## Release v${{ steps.version.outputs.version }}
          
          ### Installation
          ```bash
          pip install fancygit==${{ steps.version.outputs.version }}
          ```
          
          ### Quick Start
          ```bash
          python3 launcher.py
          ```
          
          ### What's New
          See the commit history for detailed changes.
        files: |
          dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      run: |
        if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
          echo "Checking if version ${{ steps.version.outputs.version }} already exists on PyPI..."
          if python3 -c "import requests; r=requests.get(f'https://pypi.org/pypi/fancygit/${{ steps.version.outputs.version }}/json'); exit(0 if r.status_code==200 else 1)" 2>/dev/null; then
            echo "Version ${{ steps.version.outputs.version }} already exists on PyPI, skipping upload"
          else
            echo "Uploading new version ${{ steps.version.outputs.version }} to PyPI..."
            twine upload dist/* --verbose
          fi
        else
          echo "PYPI_API_TOKEN not configured, skipping PyPI publish"
        fi
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # Manual version bump
  manual-bump:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Ensure VERSION file exists
      run: |
        if [ ! -f "VERSION" ]; then
          echo "1.0.0" > VERSION
        fi
    
    - name: Get current version
      id: version
      run: |
        if [ -f "VERSION" ]; then
          CURRENT_VERSION=$(cat VERSION)
        else
          CURRENT_VERSION="1.0.0"
        fi
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
    
    - name: Bump version
      run: |
        python -c "current='${{ steps.version.outputs.current_version }}'.split('.'); release_type='${{ github.event.inputs.release_type }}'; [setattr(current, 0, str(int(current[0])+1)), setattr(current, 1, '0'), setattr(current, 2, '0')] if release_type=='major' else [setattr(current, 1, str(int(current[1])+1)), setattr(current, 2, '0')] if release_type=='minor' else setattr(current, 2, str(int(current[2])+1)); new_version='.'.join(current); open('VERSION','w').write(new_version)"
    
    - name: Get new version
      id: new_version
      run: |
        NEW_VERSION=$(cat VERSION)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Create commit and tag
      run: |
        git add VERSION
        git commit -m "chore: bump ${{ github.event.inputs.release_type }} version to ${{ steps.new_version.outputs.new_version }} [skip ci]"
        git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Release ${{ steps.new_version.outputs.new_version }}"
        git push origin $(basename ${{ github.ref }}) --follow-tags

  # Notification job - runs after all jobs
  notify:
    runs-on: ubuntu-latest
    needs: [test, patch, release, manual-bump]
    if: always()
    
    steps:
    - name: Determine overall status
      id: status
      run: |
        TEST_RESULT="${{ needs.test.result }}"
        PATCH_RESULT="${{ needs.patch.result }}"
        RELEASE_RESULT="${{ needs.release.result }}"
        MANUAL_BUMP_RESULT="${{ needs.manual-bump.result }}"
        
        echo "DEBUG: test=$TEST_RESULT, patch=$PATCH_RESULT, release=$RELEASE_RESULT, manual-bump=$MANUAL_BUMP_RESULT" >&2
        
        if [[ "$TEST_RESULT" == "failure" ]]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        elif [[ "$TEST_RESULT" != "success" ]]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        elif [[ "$PATCH_RESULT" == "failure" || "$RELEASE_RESULT" == "failure" || "$MANUAL_BUMP_RESULT" == "failure" ]]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        else
          echo "status=passed" >> $GITHUB_OUTPUT
        fi
    
    - uses: actions/checkout@v4
    
    - name: Send notification
      run: |
        python scripts/send_email_notification.py "${{ steps.status.outputs.status }}" "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.repository }}"
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
