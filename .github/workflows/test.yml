name: Tests

on:
  push:
    branches: [ developer, main ]
  pull_request:
    branches: [ developer, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        
    - name: Run unit tests
      run: |
        pytest -m "unit" -v --cov=src --cov-report=xml
        
    - name: Run integration tests
      run: |
        pytest -m "integration" -v
        
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Debug email configuration
      run: |
        echo "Sender email is configured: ${{ secrets.SENDER_EMAIL != '' }}"
        echo "Sender password is configured: ${{ secrets.SENDER_PASSWORD != '' }}"
        echo "Commit author email: $(git log -1 --pretty=format:%ae)"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
    
    - name: Send email notification on success
      if: needs.test.result == 'success'
      run: |
        python scripts/send_email_notification.py "passed" "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.repository }}"
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        
    - name: Send email notification on failure
      if: needs.test.result == 'failure'
      run: |
        python scripts/send_email_notification.py "failed" "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.repository }}"
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}

    
