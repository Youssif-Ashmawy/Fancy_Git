name: Continuous Deployment

on:
  push:
    branches: [ developer ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install build
    
    - name: Run tests
      run: |
        pytest -m "unit" -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  patch:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/developer' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -r requirements-dev.txt
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Get current version
      id: version
      run: |
        if [ -f "VERSION" ]; then
          CURRENT_VERSION=$(cat VERSION)
        else
          CURRENT_VERSION="1.0.0"
        fi
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
    
    - name: Bump patch version
      run: |
        python -c "current='${{ steps.version.outputs.current_version }}'.split('.'); current[-1]=str(int(current[-1])+1); new_version='.'.join(current); open('VERSION','w').write(new_version)"
    
    - name: Get new version
      id: new_version
      run: |
        NEW_VERSION=$(cat VERSION)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
    
    - name: Create commit and tag
      run: |
        git add VERSION
        git commit -m "chore: bump version to ${{ steps.new_version.outputs.new_version }} [skip ci]"
        git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Release version ${{ steps.new_version.outputs.new_version }}"
        git push origin developer --follow-tags
    
    - name: Create VERSION file
      run: |
        if [ ! -f "VERSION" ]; then
          echo "1.0.0" > VERSION
        fi
    
    - name: Build package
      run: |
        python -m build
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ steps.new_version.outputs.new_version }}"
        name: "Release v${{ steps.new_version.outputs.new_version }}"
        body: |
          ## Release v${{ steps.new_version.outputs.new_version }}
          
          ### Changes
          - Automated patch release from main branch
          
          ### Installation
          ```bash
          pip install fancygit==${{ steps.new_version.outputs.new_version }}
          ```
          
          ### Quick Start
          ```bash
          python3 launcher.py
          ```
        files: |
          dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -r requirements-dev.txt
    
    - name: Get version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Update VERSION file
      run: |
        echo "${{ steps.version.outputs.version }}" > VERSION
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add VERSION
        git diff --staged --quiet || git commit -m "chore: update VERSION to ${{ steps.version.outputs.version }} [skip ci]"
        git push || true
    
    - name: Build package
      run: |
        python -m build
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v${{ steps.version.outputs.version }}"
        name: "Release v${{ steps.version.outputs.version }}"
        body: |
          ## Release v${{ steps.version.outputs.version }}
          
          ### Installation
          ```bash
          pip install fancygit==${{ steps.version.outputs.version }}
          ```
          
          ### Quick Start
          ```bash
          python3 launcher.py
          ```
          
          ### What's New
          See the commit history for detailed changes.
        files: |
          dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manual-bump:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Get current version
      id: version
      run: |
        if [ -f "VERSION" ]; then
          CURRENT_VERSION=$(cat VERSION)
        else
          CURRENT_VERSION="1.0.0"
        fi
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
    
    - name: Bump version
      run: |
        python -c "current='${{ steps.version.outputs.current_version }}'.split('.'); release_type='${{ github.event.inputs.release_type }}'; [setattr(current, 0, str(int(current[0])+1)), setattr(current, 1, '0'), setattr(current, 2, '0')] if release_type=='major' else [setattr(current, 1, str(int(current[1])+1)), setattr(current, 2, '0')] if release_type=='minor' else setattr(current, 2, str(int(current[2])+1)); new_version='.'.join(current); open('VERSION','w').write(new_version)"
    
    - name: Get new version
      id: new_version
      run: |
        NEW_VERSION=$(cat VERSION)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Create commit and tag
      run: |
        git add VERSION
        git commit -m "chore: bump ${{ github.event.inputs.release_type }} version to ${{ steps.new_version.outputs.new_version }} [skip ci]"
        git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Release ${{ steps.new_version.outputs.new_version }}"
        git push origin developer --follow-tags
    
    - name: Trigger release workflow
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"trigger_release","client_payload":{"version":"${{ steps.new_version.outputs.new_version }}"}}'

  notify:
    runs-on: ubuntu-latest
    needs: [patch, release, manual-bump]
    if: always()
    
    steps:
    - name: Determine deployment status
      id: status
      run: |
        if [[ "${{ needs.patch.result }}" == "success" || "${{ needs.release.result }}" == "success" || "${{ needs.manual-bump.result }}" == "success" ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
        fi
    
    - uses: actions/checkout@v4
    
    - name: Send deployment notification
      run: |
        python scripts/send_email_notification.py "deployed_${{ steps.status.outputs.status }}" "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.repository }}"
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
